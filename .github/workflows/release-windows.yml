name: Release (Windows)

# The Windows installer cannot be cross-built from the Mac that cuts our releases
# — electron-builder needs wine for an NSIS target, and it isn't installed there.
# v1.0.3 shipped macOS-only for exactly that reason, which left Windows users on
# the previous build (and, that release being the passkey fix, unable to sign in
# with a passkey at all). This job builds the Windows half on a Windows runner and
# uploads it into the SAME GitHub release, which is where electron-updater looks
# for latest.yml.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and upload into (e.g. v1.0.3)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Includes scripts/passkey-domain-test.js, so a Windows build can never
      # ship pointing at a host our passkey RP ID is invalid for.
      - run: npm run check

      # Build only. electron-builder's own GitHub publisher cannot be used here: it
      # refuses an existing release that was published more than 2 hours ago
      # ("existing release published more than 2 hours ago") and, before that, any
      # release whose type does not match its default `draft` — and it reports both
      # refusals as SUCCESS. `gh release upload` has neither restriction.
      - name: Build the Windows installer
        shell: bash
        run: npx electron-builder --win --publish never

      - name: Upload into the release
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG does not exist. Cut the macOS release first (npm run release -- --mac, then publish the draft), then re-run this job."
            exit 1
          fi
          gh release upload "$TAG" \
            dist/Atha-OS-Setup-x64.exe \
            dist/Atha-OS-Setup-x64.exe.blockmap \
            dist/latest.yml \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # An upload that silently did nothing looks exactly like one that worked, so
      # ask GitHub what the release actually contains rather than trusting exit codes.
      - name: Verify the installer reached the release
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "$ASSETS"
          for want in Atha-OS-Setup-x64.exe latest.yml; do
            echo "$ASSETS" | grep -qx "$want" || { echo "::error::$want missing from release $TAG"; exit 1; }
          done
          echo "Windows installer and update feed are present on $TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
