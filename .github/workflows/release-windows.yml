name: Release (Windows)

# The Windows installer cannot be cross-built from the Mac that cuts our releases
# — electron-builder needs wine for an NSIS target, and it isn't installed there.
# v1.0.3 shipped macOS-only for exactly that reason, which left Windows users on
# the previous build (and, that release being the passkey fix, unable to sign in
# with a passkey at all). This job builds the Windows half on a Windows runner and
# uploads it into the SAME GitHub release, which is where electron-updater looks
# for latest.yml.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and upload into (e.g. v1.0.3)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Includes scripts/passkey-domain-test.js, so a Windows build can never
      # ship pointing at a host our passkey RP ID is invalid for.
      - run: npm run check

      # -c.publish.releaseType=release is NOT redundant with package.json: this job
      # checks out an existing TAG, whose package.json predates that setting. Without
      # the override electron-builder defaults to `draft`, refuses to touch an
      # already-published release ("existing type not compatible with publishing
      # type"), skips every upload — and still exits 0.
      - name: Build and publish the Windows installer
        run: npx electron-builder --win --publish always -c.publish.releaseType=release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-builder reports a skipped upload as success, so a green build proves
      # nothing. Ask GitHub what the release actually contains.
      - name: Verify the installer reached the release
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "$ASSETS"
          for want in Atha-OS-Setup-x64.exe latest.yml; do
            echo "$ASSETS" | grep -qx "$want" || { echo "::error::$want missing from release $TAG"; exit 1; }
          done
          echo "Windows installer and update feed are present on $TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
