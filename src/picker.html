<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self' file:"
    />
    <title>Choose what to share</title>
    <style>
      :root {
        --bg: #0f1729;
        --panel: #182131;
        --panel-hover: #1f2a3d;
        --border: #2a3547;
        --text: #e7ecf3;
        --muted: #8a97ab;
        --accent: #f36f21;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        user-select: none;
        cursor: default;
      }
      header { padding: 16px 20px 10px; }
      h1 { margin: 0 0 12px; font-size: 15px; font-weight: 600; }
      .tabs { display: flex; gap: 6px; }
      .tab {
        padding: 5px 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        cursor: pointer;
      }
      .tab[aria-selected="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      main {
        flex: 1;
        overflow-y: auto;
        padding: 6px 20px 16px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .card {
        display: block;
        width: 100%;
        padding: 8px;
        border: 2px solid transparent;
        border-radius: 10px;
        background: var(--panel);
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .card:hover { background: var(--panel-hover); }
      .card[aria-pressed="true"] { border-color: var(--accent); background: var(--panel-hover); }
      .thumb {
        width: 100%;
        aspect-ratio: 16 / 10;
        object-fit: contain;
        border-radius: 6px;
        background: #0b1220;
        display: block;
      }
      .label {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 8px;
        font-size: 12px;
      }
      .label img { width: 14px; height: 14px; flex: none; }
      .label span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .empty { color: var(--muted); padding: 40px 0; text-align: center; }
      footer {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 12px 20px;
        border-top: 1px solid var(--border);
      }
      button.action {
        padding: 7px 16px;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      button.action.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }
      button.action:disabled { opacity: 0.45; cursor: default; }
    </style>
  </head>
  <body>
    <header>
      <h1>Choose what to share</h1>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-screen" aria-selected="true">Entire screen</button>
        <button class="tab" role="tab" id="tab-window" aria-selected="false">Window</button>
      </div>
    </header>
    <main><div class="grid" id="grid"></div></main>
    <footer>
      <button class="action" id="cancel">Cancel</button>
      <button class="action primary" id="share" disabled>Share</button>
    </footer>
    <script src="picker.js"></script>
  </body>
</html>
